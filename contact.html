<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact – Jeffo Blogs' AQI Monitor</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>🌍</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#080e1a; --surface:#0d1526; --border:#1a2a42; --accent:#3b82f6; --accent2:#06b6d4; --text:#e2e8f0; --muted:#64748b; --good:#22c55e; }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Syne',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }
    nav { display:flex; align-items:center; justify-content:space-between; padding:0 24px; height:60px; background:var(--surface); border-bottom:1px solid var(--border); }
    .nav-brand { font-size:15px; font-weight:700; color:var(--text); text-decoration:none; display:flex; align-items:center; gap:8px; }
    .live-dot { width:7px; height:7px; background:var(--good); border-radius:50%; }
    .nav-links { display:flex; align-items:center; gap:4px; }
    .nav-link { font-family:'Syne',sans-serif; font-size:13px; font-weight:600; color:var(--muted); text-decoration:none; padding:6px 14px; border-radius:6px; transition:all 0.15s; }
    .nav-link:hover { color:var(--text); background:var(--border); }
    .nav-link.active { color:var(--accent); }
    .nav-api { font-family:'DM Mono',monospace; font-size:12px; color:var(--accent2); text-decoration:none; padding:5px 12px; border:1px solid var(--accent2); border-radius:5px; margin-left:6px; }
    .nav-api:hover { background:rgba(6,182,212,0.1); }
    .main { max-width:800px; margin:0 auto; padding:40px 24px; }
    .page-title { font-size:28px; font-weight:800; margin-bottom:8px; }
    .page-sub { font-size:14px; color:var(--muted); margin-bottom:32px; }
    .card { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:28px; }
    .form-group { margin-bottom:18px; }
    .form-group label { display:block; font-size:11px; font-weight:700; letter-spacing:0.07em; text-transform:uppercase; color:var(--muted); margin-bottom:7px; }
    .form-group input, .form-group textarea { width:100%; font-family:'Syne',sans-serif; font-size:13px; padding:10px 14px; background:var(--bg); border:1px solid var(--border); border-radius:7px; color:var(--text); transition:border-color 0.15s; resize:vertical; }
    .form-group input:focus, .form-group textarea:focus { outline:none; border-color:var(--accent); }
    .btn { font-family:'Syne',sans-serif; font-size:13px; font-weight:600; padding:10px 20px; border-radius:7px; border:none; cursor:pointer; background:var(--accent); color:#fff; transition:all 0.15s; width:100%; }
    .btn:hover { background:#2563eb; }
    #contactStatus { margin-top:12px; font-size:13px; color:var(--muted); }
  </style>
</head>
<body>
<nav>
  <a class="nav-brand" href="index.html"><div class="live-dot"></div>🌍 Jeffo's AQI</a>
  <div class="nav-links">
    <a class="nav-link" href="about.html">About</a>
    <a class="nav-link active" href="contact.html">Contact</a>
    <a class="nav-api" href="api.html">API ↗</a>
  </div>
</nav>
<div class="main">
  <div class="page-title">Get in Touch</div>
  <div class="page-sub">Questions, feedback, or data corrections — drop a message below.</div>
  <div class="card">
    <div class="form-group"><label>Name</label><input type="text" id="contactName" placeholder="Your name"></div>
    <div class="form-group"><label>Email</label><input type="email" id="contactEmail" placeholder="your@email.com"></div>
    <div class="form-group"><label>Message</label><textarea id="contactMsg" rows="6" placeholder="What's on your mind?"></textarea></div>
    <button class="btn" onclick="submitContact()">Send Message</button>
    <div id="contactStatus"></div>
  </div>
</div>
<script>
  function submitContact() {
    const name = document.getElementById('contactName').value.trim();
    const email = document.getElementById('contactEmail').value.trim();
    const msg = document.getElementById('contactMsg').value.trim();
    const status = document.getElementById('contactStatus');
    if (!name || !email || !msg) { status.textContent = 'Please fill in all fields.'; status.style.color = '#ef4444'; return; }
    status.textContent = '✓ Message sent! We\'ll get back to you soon.';
    status.style.color = '#22c55e';
    document.getElementById('contactName').value = '';
    document.getElementById('contactEmail').value = '';
    document.getElementById('contactMsg').value = '';
  }
</script>
</body>
</html>
